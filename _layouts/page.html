---
layout: default
bodyClass: "page-app-detail"
---

<section class="app-detail">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <header class="app-detail__header">
          <p class="eyebrow">Independent Works</p>
          <h1>{{ page.title }}</h1>
          {% if page.description %}<p class="app-detail__lead">{{ page.description }}</p>{% endif %}
        </header>
        <div class="content">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</section>
