---
layout: default
bodyClass: "page-app-detail"
---

{% assign app = site.data.apps[page.app_key] %}

{% include app-nav.html app=app %}

<section class="app-detail">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <header class="app-detail__header">
          <p class="eyebrow">{{ app.name }}</p>
          <h1>{{ page.title }}</h1>
          {% if page.description %}<p class="app-detail__lead">{{ page.description }}</p>{% endif %}
        </header>
        <div class="content legal-content">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</section>
