<svg width="512" height="512" viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!--
      白色区域保留，黑色区域透明。用三个黑色矩形从圆环中真正扣除缺口。
    -->
    <mask id="ring-mask"
      maskUnits="userSpaceOnUse"
      x="0" y="0" width="512" height="512">

      <!-- 默认全部保留 -->
      <rect x="0" y="0" width="512" height="512" fill="white" />

      <!-- 三个透明缺口 -->
      <rect x="236" y="36"
        width="40" height="80"
        fill="black" />

      <rect x="364" y="292"
        width="80" height="40"
        transform="rotate(30 404 312)"
        fill="black" />

      <rect x="68" y="292"
        width="80" height="40"
        transform="rotate(-30 108 312)"
        fill="black" />
    </mask>
  </defs>

  <!-- 外圈玉璧（赛博环） -->
  <circle cx="256" cy="256" r="200"
    fill="none"
    stroke="#FF2D92"
    stroke-width="40"
    stroke-linecap="round"
    mask="url(#ring-mask)" />

  <!-- 内部六边形芯片 -->
  <polygon fill="#15F5C9"
    points="
             351.3,201.0
             351.3,311.0
             256.0,366.0
             160.7,311.0
             160.7,201.0
             256.0,146.0
           " />
</svg>
