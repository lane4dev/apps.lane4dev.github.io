tagline: "把每一笔收支，记得清楚一点。"
short_description: "记录日常收支、管理多账户余额与周期账单，并按分类生成月度报表；无需注册登录，账本始终留在你的设备本地。"
home_story: "市面上成熟的记账软件已经足够多，并不缺一个大而全的新面孔。所以我没打算用记然去覆盖所有人的需求，而是把重心收束在周期性账单与预算管理上——不只记下一笔花销，更想留住这笔钱背后的「所以然」。在我看来，记账的终点从来不是把数字填满，而是回头复盘时能坦然看清每一笔花在哪儿、值不值当，然后更从容地规划下一次消费。"
long_description: "记录收入和支出、管理账户、查看月度报表，也可以为未来的账单设置计划和提醒。账本数据保存在你的设备上。"
