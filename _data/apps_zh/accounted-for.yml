philosophy_eyebrow: "PHILOSOPHY"
philosophy_heading: "记账久了，真正的难题往往不是懒得记，而是账越记越模糊。"
philosophy_paragraphs:
  - "记账的终点从来不是把数字填满，而是回头复盘时能坦然看清：每一笔花在哪儿、值不值当，以及下个月该如何更从容地安排预算。"
  - "因此，记然从底层账本语义出发，把期初余额、余额校准、账户间转账与真实收支彻底分开——调账不污染收支，还款不重复计费，让余额与报表始终同源。"
  - "一切都围绕「先规划、再追踪、后复盘」的预算节奏展开。账本留在你的设备上，安静、严谨，只服务于你自己的财务清醒。"

pillars_eyebrow: "FEATURES"
pillars_heading: |-
  复盘 · 追踪 · 规划
  一体化预算
pillars:
  - num: "(01)"
    title: "以预算为中心的月度视角"
    body: "本月追踪自动结合已消费与待付固定账单，一眼看清预计剩余；记账时选完分类即刻反馈记后余量与超支提醒。分类预算自动向后沿用，微调单月不影响后续规划，也能提前看清远期的固定支出占比。"
  - num: "(02)"
    title: "为复盘而生的报表与洞察"
    body: "历史月份严格按已入账实际支出评估，搭配多月预算与实际趋势、固定与弹性支出构成、异常波动提醒、每日资金净流向热力图以及月度与分类复盘备忘——帮你看懂钱花得值不值当。"
  - num: "(03)"
    title: "账实严谨，周期账单安心可控"
    body: "期初余额、余额调整与账户转账独立于收支统计；编辑周期账单时清晰区分「仅这一期」与「修改规则」，已入账历史保持原貌，长期未打开导致的积压账单也会自动转为手动核对，避免静默误记。"

flow_eyebrow: "FLOW"
flow_heading: "三个步骤，建立稳固的预算与复盘节奏"
flow_steps:
  - num: "(Step 01)"
    title: "规划预算与固定账单"
    body: "按分类定好预算边界，把房租、订阅等固定支出纳入周期计划。远期月份预算自然沿用，固定账单占比提前可见，让你在花钱之前先心里有数。"
  - num: "(Step 02)"
    title: "克制记账，实时知余量"
    body: "记录收支、转账与票据附件；在表单中选完分类与金额即可看到记后余量与超支预警，帮你做决定而不打断记账。支持隐私模式一键隐藏总览金额。"
  - num: "(Step 03)"
    title: "定期复盘，数据完全归你"
    body: "月末对照预算与实际趋势、查看热力图并写下复盘备忘，校准下一次消费。原生支持独立多币种视图、关键词检索导出 CSV，以及随时手动备份与恢复。"

faq_eyebrow: "FAQ"
faq_heading: "常见问题"
faqs:
  - num: "Q.01"
    q: "需要联网或注册账号吗？"
    a: "不需要。记然离线即可完整使用，无需注册登录，也不会连接任何银行账户。"
  - num: "Q.02"
    q: "开启「自动入账」会从银行卡扣款吗？"
    a: "不会。自动入账仅在应用内按期记录账单，不涉及真实资金扣划；遇到长期积压也会自动转为手动确认。"
  - num: "Q.03"
    q: "支持多币种汇率自动换算吗？"
    a: "不做近似汇率混算。记然为不同币种维护独立的账本、预算与报表视图，切换币种不会改动账户原有金额。"
  - num: "Q.04"
    q: "换手机时如何迁移数据？"
    a: "在「设置」中手动导出账本备份并在新设备恢复即可（恢复会替换当前账本）。图片与文件附件原件不包含在备份中，换机前请另行保存。"
