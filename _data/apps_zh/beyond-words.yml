name: "言外"
slug: "beyond-words"
tagline: "在合适的语境中，准确表达你的意思。"
short_description: "选定沟通语境，将现有文本改写、翻译或整理为结构化提示词——不替你虚构事实，也支持导入自定义语境包。"
home_story: "表达这件事，不必每次都那么严肃。言外既能帮你在需要分寸的场合把话说得体面、说得准，也留了一块让你随手试探边界的游乐场——只要换个语境包，一句平平无奇的日常消息就能瞬间跑偏到另一个次元。有用是它的底线，有趣才是它真正好玩的理由。"
long_description: >-
  言外在不虚构缺失事实的前提下帮助你转换现有文本。
  选择语境、提供原文、检查生成结果，并在分享前继续调整。
