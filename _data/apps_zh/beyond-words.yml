faq_heading: "常见问题"
faqs:
  - q: "言外会替我编造原文里没有的事实吗？"
    a: "不会。言外严格围绕你提供的文本和选定语境进行转换，且生成结果始终保持可编辑，方便你在复制或分享前核对事实与分寸。"
  - q: "我的文本历史记录保存在哪里？"
    a: "历史记录默认保存在你的设备本地，不提供云端历史同步，也不要求强制注册账号。"
  - q: "Google Play 版和 APK 版有什么区别？"
    a: "Google Play 版本提供完整功能与订阅支持；独立 APK 版本有部分功能缺失，因此推荐通过 Google Play 商店下载。"
  - q: "可以自己制作和导入语境包吗？"
    a: "可以。你可以按文档格式编写自己的实用语境或趣味风格包并直接导入应用，详情可查看「自定义语境包」页面。"
