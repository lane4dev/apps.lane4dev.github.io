name: "AI 章节速览"
slug: "heading-brief"
tagline: "逐节阅读，直达重点。"
short_description: "按文章标题逐节生成摘要并紧贴原文展示，不必离开当前页面；支持自选 AI 服务商、模型与提示词。"
home_story: "我始终认为，AI 不应该替代人去阅读——面对重要或有深度的内容，亲手读完一手原文依然无可替代。AI 章节速览想做的，其实是帮你削减进入长文时的那一点摩擦：在每个标题旁先递上一小段提要，让你在真正读下去之前，脑子里先有了落脚点和关注的重心。它不替你跳过原文，而是让接下来的阅读更顺畅、更有方向。"
long_description: "选择标题，即可在当前页面获取该章节及其子章节的摘要。"
