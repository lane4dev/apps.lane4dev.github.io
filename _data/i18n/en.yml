  notes:
    - index: "01"
      title: "Small tools, unhidden taste"
      body: "I'm not trying to build everything for everyone. Software is a form of self-expression—a record of how I see a problem, and what I think good tools should feel like."
    - index: "02"
      title: "Interesting first, useful second"
      body: "The best tools are both useful and interesting. When I can't have both, I'll choose interesting first—it's what makes building worthwhile, and using it a little more joyful."
    - index: "03"
      title: "Intuitive, self-evident design"
      body: "Good design shouldn't need an onboarding tour or a wall of explanations to make sense. You should be able to pick it up and just know where things live—when the interface steps out of the way, what you actually came to do takes center stage."
    - index: "04"
      title: "Real problems, kept alive by iteration"
      body: "Every app starts with something I needed myself, before being shared with everyone else. Solving a real problem gives software its value; continuous iteration is what keeps it alive."
  closing_lead: "If any of these small tools resonates with you, take it for a spin—or write and say hello."
