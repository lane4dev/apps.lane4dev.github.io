  notes:
    - index: "01"
      title: "偏爱小而美，不隐藏审美倾向"
      body: "不追求大而全。写软件对我来说是一种自我表达——关于我如何看待一个问题，也关于我对「好工具」的审美偏好。"
    - index: "02"
      title: "先有趣，再有用"
      body: "理想的作品在有趣与有用之间找到平衡；如果二者无法兼得，我希望它首先是有趣的。有趣让创作值得开始，也让日常使用多一点愉悦。"
    - index: "03"
      title: "符合直觉，不言自明"
      body: "好的设计不需要长篇大论的新手引导，也不该靠一堆说明文字去解释自己。拿起来就知道怎么用，每一步都顺着人的本能往下走——工具退后一步，你想做的事才能走到台前。"
    - index: "04"
      title: "解决真问题，在迭代里生长"
      body: "工具先从我自己的需求出发，再分享给全世界。解决实际问题赋予它价值，而持续的打磨与迭代，才让软件真正拥有生命力。"
  closing_lead: "如果你也在其中某款小工具里找到了共鸣，欢迎试用，或者来信聊聊。"
