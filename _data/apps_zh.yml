beyond-words:
  name: "言外"
  slug: "beyond-words"
  tagline: "在合适的语境中，准确表达你的意思。"
  short_description: "一款感知上下文的写作助手，支持改写、翻译、语气调整和提示词规范化。"
  long_description: >-
    言外在不虚构缺失事实的前提下帮助你转换现有文本。
    选择语境、提供原文、检查生成结果，并在分享前继续调整。
  status: "已在 Google Play 上架"
  platform: "Android"
  store_label: "前往 Google Play"
  store_prefix: "立即下载"

  base_path: "/zh/beyond-words/"
  custom_packs_path: "/zh/beyond-words/custom-context-packs/"
  privacy_path: "/zh/beyond-words/privacy/"
  terms_path: "/zh/beyond-words/terms/"
  support_path: "/zh/beyond-words/support/"

  features:
    - title: "感知上下文的改写"
      description: "根据受众、渠道、语气或沟通目标调整措辞。"
    - title: "保留意图的翻译"
      description: "在转换为另一种语言时，保留消息的实际含义。"
    - title: "提示词规范化"
      description: "将粗略的一行请求整理为适合语言模型使用的结构化提示词。"
    - title: "可复用语境包"
      description: "使用内置或导入的语境包，获得可重复的转换效果。"
    - title: "使用前检查"
      description: "生成文本保持可编辑，以便核对事实、语气和适用性。"
    - title: "历史记录与复用"
      description: "返回设备中保存的既有结果，并继续调整。"

  workflow:
    - title: "选择语境"
      description: "选择符合当前沟通场景的转换方式。"
    - title: "提供现有文本"
      description: "言外基于你提供的文本和上下文工作。"
    - title: "检查并调整"
      description: "复制、分享或用于其他场景之前检查结果。"

  privacy:
    firebase_services: "Firebase Authentication、Cloud Functions、Firestore 和 App Check"

  support:
    in_app_report_path: "使用生成结果旁边的“举报”操作。"

heading-brief:
  name: "章节速览"
  slug: "heading-brief"
  tagline: "逐节阅读，直达重点。"
  short_description: "一款浏览器扩展，可在原文旁概括文章章节。"
  long_description: "选择标题，即可在当前页面获取该章节及其子章节的摘要。"
  status: "商店页面待上线"
  platform: "Chrome"
  store_label: "Chrome 网上应用店"
  base_path: "/zh/heading-brief/"
  privacy_path: "/zh/heading-brief/privacy/"
  terms_path: "/zh/heading-brief/terms/"
  support_path: "/zh/heading-brief/support/"
  capabilities_heading: "按自己的节奏阅读"
  capabilities_intro: "选择需要阅读的章节和适合你的 AI 服务。"
  workflow_heading: "三步获取摘要"
  workflow_intro: "配置服务、打开文章，然后选择一个章节。"
  transparency_heading: "由你选择内容的去向"
  transparency_intro: "了解扩展如何处理网页内容、设置和摘要请求。"
  features:
    - title: "选择 AI 服务"
      description: "选择受支持的服务和模型，设置输出语言并自定义提示词。"
    - title: "概括章节"
      description: "概括标题及其子章节；识别到文章主标题时，也可概括全文。"
    - title: "对照原文阅读"
      description: "在原文旁阅读摘要，查看提取的内容、复制结果或重新生成。"
  workflow:
    - title: "配置服务"
      description: "选择模型，并在需要时输入 API 密钥，或配置受支持的端点。"
    - title: "打开文章"
      description: "章节速览在已启用的网站上查找文章标题并添加摘要按钮。"
    - title: "选择章节"
      description: "点击按钮，在原文旁生成摘要。"
