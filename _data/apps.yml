beyond-words:
  name: "Beyond Words"
  slug: "beyond-words"
  app_icon: "/assets/images/beyond_words/app_logo.png"
  screenshots:
    - "/assets/images/beyond_words/screen_shoot_zh/01.png"
    - "/assets/images/beyond_words/screen_shoot_zh/02.png"
    - "/assets/images/beyond_words/screen_shoot_zh/03.png"
    - "/assets/images/beyond_words/screen_shoot_zh/04.png"
    - "/assets/images/beyond_words/screen_shoot_zh/05.png"
    - "/assets/images/beyond_words/screen_shoot_zh/06.png"
  tagline: "Say what you mean, in the context that fits."
  short_description: "A context-aware writing assistant for rewriting, translation, tone adjustment, and prompt normalization."
  long_description: >-
    Beyond Words helps you transform existing text without inventing missing
    facts. Select a context, provide your text, review the generated result,
    and refine it before sharing.
  status: "Available on Google Play"
  platform: "Android"

  store_enabled: true
  store_url: "https://play.google.com/store/apps/details?id=me.tangyu.beyondwords"
  store_label: "Get it on Google Play"
  store_prefix: "GET IT ON"

  base_path: "/beyond-words/"
  custom_packs_path: "/beyond-words/custom-context-packs/"
  privacy_path: "/beyond-words/privacy/"
  terms_path: "/beyond-words/terms/"
  support_path: "/beyond-words/support/"

  features:
    - title: "Context-aware rewriting"
      description: "Transform wording for a specific audience, channel, tone, or communication goal."
    - title: "Translation with intent"
      description: "Preserve the practical meaning of a message while adapting it to another language."
    - title: "Prompt normalization"
      description: "Turn a rough one-line request into a structured prompt suitable for a language model."
    - title: "Reusable context packs"
      description: "Use built-in or imported context packs for repeatable transformations."
    - title: "Review before use"
      description: "Generated text remains editable so you can verify facts, tone, and suitability."
    - title: "History and reuse"
      description: "Return to previous results stored on the device and continue refining them."

  workflow:
    - title: "Choose a context"
      description: "Select the transformation that matches the communication situation."
    - title: "Provide existing text"
      description: "Beyond Words works from the text and context you supply."
    - title: "Review and refine"
      description: "Check the result before copying, sharing, or using it elsewhere."

  privacy:
    account_required: false
    local_history_enabled: true
    cloud_history_sync_enabled: false
    analytics_enabled: false
    diagnostics_enabled: false
    advertising_enabled: false

    firebase_services: "Firebase Authentication, Cloud Functions, Firestore, and App Check"

  subscriptions:
    enabled: true
    billing_provider: "Google Play Billing"
    restore_supported: true

  support:
    harmful_output_reporting: true
    in_app_report_path: "Use the Report action beside a generated result."

heading-brief:
  name: "Heading Brief"
  slug: "heading-brief"
  app_icon: "/assets/images/heading_brief/app_logo.png"
  screenshots:
    - "/assets/images/heading_brief/screen_shoot/01.png"
  tagline: "Get to the point, one section at a time."
  short_description: "A browser extension that summarizes article sections beside the original text."
  long_description: "Choose a heading to summarize its section and subsections without leaving the page."
  status: "Store listing pending"
  platform: "Chrome"
  store_enabled: false
  store_label: "Chrome Web Store"
  base_path: "/heading-brief/"
  privacy_path: "/heading-brief/privacy/"
  terms_path: "/heading-brief/terms/"
  support_path: "/heading-brief/support/"
  capabilities_heading: "Read at your own pace"
  capabilities_intro: "Choose the sections and AI provider that fit how you read."
  workflow_heading: "Three steps to a summary"
  workflow_intro: "Set up a provider, open an article, and choose a section."
  transparency_heading: "Choose where your content goes"
  transparency_intro: "Review how the extension handles page content, settings, and summary requests."
  features:
    - title: "Choose your AI provider"
      description: "Select a supported provider and model, set an output language, and customize the prompt."
    - title: "Summarize a section"
      description: "Summarize a heading and its subsections, or the whole article when its main title is detected."
    - title: "Keep the original in view"
      description: "Read summaries beside the source, inspect extracted text, copy a result, or generate it again."
  workflow:
    - title: "Set up your provider"
      description: "Choose a model and enter an API key if needed, or configure a supported endpoint."
    - title: "Open an article"
      description: "Heading Brief finds article headings on enabled sites and adds summary buttons."
    - title: "Choose a section"
      description: "Select a button to generate a summary beside the original text."
