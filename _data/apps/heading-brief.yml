  - "/assets/images/heading-brief/screen_shoot/01.png"
tagline: "Get to the point, one section at a time."
short_description: "Summarize any article section right beside the original text without leaving the page, using the AI provider and model you choose."
home_story: "AI shouldn't read on your behalf—there is no real substitute for engaging directly with original, primary text. AI Heading Brief is simply meant to take the friction out of diving into long writing. By placing a short preview right beside each heading, it gives your mind a few anchors before you read on—not to skip the text, but to enter it with sharper focus."
long_description: "Choose a heading to summarize its section and subsections without leaving the page."
