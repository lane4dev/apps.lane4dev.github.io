tagline: "Say what you mean, in the context that fits."
short_description: "Rewrite, translate, adjust tone, or structure prompts from your own text—grounded in what you wrote, with reusable context packs."
home_story: "Expression doesn't always have to be so serious. Beyond Words can help you land the right tone when it counts, yet it also leaves room for a playground—swap the context pack and an ordinary message can veer straight into another universe. Being useful is the baseline; being fun to mess around with is the real point."
long_description: >-
  Beyond Words helps you transform existing text without inventing missing
  facts. Select a context, provide your text, review the generated result,
  and refine it before sharing.
