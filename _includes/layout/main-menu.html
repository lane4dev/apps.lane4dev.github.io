<nav id="main-menu" class="main-menu" aria-label="{{ t.nav.pages_label }}">
  <ul class="main-menu__list">
    {% for app_page in sorted_apps %}
    <li class="main-menu__item{% if app_page.url == page.url %} active{% endif %}">
      <a class="main-menu__link" href="{{ app_page.url | relative_url }}">{{ app_page.title | escape }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>
