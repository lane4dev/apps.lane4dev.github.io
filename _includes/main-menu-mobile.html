{% assign sorted_apps = site.apps | where: "lang", current_lang | sort: "weight" %}
<nav id="main-menu-mobile" class="main-menu-mobile" aria-label="{{ t.nav.pages_label }}">
  <div class="main-menu-mobile__inner">
    <ul class="main-menu-mobile__list">
      {% for app_page in sorted_apps %}
      <li class="main-menu-mobile__item{% if app_page.url == page.url %} active{% endif %}">
        <a class="main-menu-mobile__link" href="{{ app_page.url | relative_url }}">{{ app_page.title | escape }}</a>
      </li>
      {% endfor %}
    </ul>
    <div class="main-menu-mobile__footer">
      {% include footer-blocks.html modifier="footer__grid--drawer" %}
    </div>
  </div>
</nav>
